# Allow the standalone frontend (GitHub Pages project site of this fork) to
# call the hub. CORS matches on the origin only, so the project path /hapi/ is
# irrelevant here. Comma-separated; keep https://app.hapi.run as long as the
# official web app is also used. Setting CORS_ORIGINS replaces the origin the
# hub derives from its own public URL, so list every browser origin you use.
[Service]
Environment=CORS_ORIGINS=https://sh3wn.github.io,https://app.hapi.run